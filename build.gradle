plugins {
    id 'com.android.application' version '8.7.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.0' apply false
}

ext {
    compose_version = "1.7.0"
    lifecycle_version = "2.8.5"
    retrofit_version = "2.11.0"
    okhttp_version = "4.12.0"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}